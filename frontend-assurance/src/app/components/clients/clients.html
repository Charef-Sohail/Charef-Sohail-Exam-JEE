<div class="container mt-4">
  <div class="card">
    <div class="card-header bg-primary text-white">
      <h3>Liste des Clients</h3>
    </div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Email</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let c of clients">
          <td>{{ c.id }}</td>
          <td>{{ c.nom }}</td>
          <td>{{ c.email }}</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
